typescript:
  status: absent
  reason: as JavaScript; a decorator is a function that the class statement calls with the class, so it can check or register the class; no example file because it would repeat the JavaScript one.
kotlin:
  status: absent
  reason: KClass gives reflection on a class, and annotation processors and compiler plugins generate code, but a class cannot have a custom metaclass; no example file because kotlinc is not installed on the machine that recorded the examples.
rust:
  status: absent
  reason: a type is not a value at run time; a derive macro or a procedural macro generates code for a type at compile time.
c:
  status: absent
  reason: C has no classes and no class objects.
cpp:
  status: absent
  reason: a class is not an object at run time; templates, constexpr functions and the preprocessor generate code at compile time.
bash:
  status: n/a
  reason: Bash has no classes.
powershell:
  status: absent
  reason: a class has a [type] object for reflection, but code cannot give a class a different metaclass; no example file because pwsh is not installed on the machine that recorded the examples.
sql:
  status: n/a
  reason: SQL has no classes; the system catalog describes tables and columns as rows.
regex:
  status: n/a
  reason: a pattern has no classes.
html:
  status: n/a
  reason: HTML has no classes in this sense; the class attribute names CSS classes.
css:
  status: n/a
  reason: CSS has no classes in this sense; a class selector matches the class attribute.
