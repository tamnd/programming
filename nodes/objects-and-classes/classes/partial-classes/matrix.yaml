javascript:
  status: absent
  reason: a class is one declaration; code in another module can add methods to Class.prototype, which is monkey patching, not a partial class.
java:
  status: absent
  reason: a class is one declaration in one file; annotation processors write separate classes instead of parts of a class.
kotlin:
  status: absent
  reason: a class is one declaration; extension functions in other files add functions that are called like members but are not members; no example file because kotlinc is not installed on the machine that recorded the examples.
c:
  status: n/a
  reason: C has no classes; a struct is one declaration.
cpp:
  status: idiom
  reason: the class definition is one declaration, but its member functions can be defined in many source files, outside the class with Class::name.
