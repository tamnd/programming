c:
  status: library
  reason: ISO C has no database API; the client libraries bind values, for example sqlite3_prepare_v2 with sqlite3_bind_text in SQLite and PQexecParams in libpq.
  alternative: the bind functions of the client library; never build the text with sprintf.
cpp:
  status: library
  reason: the C++ standard library has no database API; the C client libraries and C++ wrappers such as libpqxx bind values to placeholders.
  alternative: the bind functions of the client library; never build the text with std::format or operator+.
kotlin:
  status: stdlib
  reason: on the JVM, Kotlin uses JDBC from Java SE; PreparedStatement binds values as in the Java example.
  alternative: Exposed and other Kotlin libraries make parameters from typed expressions; a string template inside SQL text has the same weakness as concatenation.
typescript:
  status: stdlib
  reason: TypeScript runs on Node.js and uses node:sqlite and the npm clients as in the JavaScript example; the type system does not tell SQL text from data.
  alternative: a query builder or a tagged template that binds the values.
powershell:
  status: library
  reason: PowerShell has no database cmdlets in its default modules; scripts use an ADO.NET provider through .NET, and DbCommand.Parameters binds the values as in the C# example.
  alternative: the Parameters collection of the command; never build CommandText with string expansion.
bash:
  status: absent
  reason: Bash has no database API; a script that puts a variable into the SQL text for a command-line client has this weakness, and the .parameter set command of the sqlite3 shell evaluates its value as an SQL expression.
  alternative: a program in a language with a database API.
sql:
  status: native
  reason: the weakness also exists inside the database, in dynamic SQL that a stored procedure builds from its arguments.
  alternative: PREPARE with EXECUTE USING, or the quoting functions of the system, such as format with %I and %L in PostgreSQL.
regex:
  status: n/a
  reason: a pattern does not build SQL text.
html:
  status: n/a
  reason: markup does not build SQL text.
css:
  status: n/a
  reason: style sheets do not build SQL text.
