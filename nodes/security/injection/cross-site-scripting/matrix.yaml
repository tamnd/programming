c:
  status: library
  reason: ISO C has no HTML or web API; a CGI program that prints input with printf has the weakness, and the escape comes from a library or from the program.
  alternative: an HTML escape function applied to each value, or a template library with automatic escaping.
cpp:
  status: library
  reason: the C++ standard library has no HTML escape function and no template engine; web frameworks for C++ provide them.
  alternative: the escaping of the framework; never build markup with std::format or operator+.
rust:
  status: library
  reason: the Rust standard library has no HTML escape function; template crates escape the values.
  alternative: a template crate that escapes by default; never build markup with format!.
kotlin:
  status: library
  reason: on the JVM, Kotlin has the Java SE APIs, which have no HTML escape function, as in the Java example.
  alternative: a template engine or an HTML builder that escapes the values; a string template inside markup has the same weakness as concatenation.
typescript:
  status: stdlib
  reason: TypeScript uses the DOM and Node.js as in the JavaScript example; the type system does not tell markup from text.
  alternative: text sinks such as textContent; where the browser supports Trusted Types, the CSP directive require-trusted-types-for 'script' makes DOM sinks reject plain strings.
powershell:
  status: stdlib
  reason: PowerShell can call the .NET encoders of the C# example, such as [System.Net.WebUtility]::HtmlEncode.
  alternative: encode each value before it goes into the markup; never build HTML with string expansion.
bash:
  status: absent
  reason: Bash has no HTML escape function; a CGI script that echoes a variable into a page has the weakness.
  alternative: a program in a language with an HTML encoder or a template engine.
sql:
  status: n/a
  reason: SQL stores the text of a stored XSS attack but does not render it; the weakness is in the code that writes the value into a page.
html:
  status: native
  reason: the weakness is the injection of markup into an HTML document; character references such as &lt; and &amp; are how HTML writes these characters as text.
  alternative: write each value as text through the encoder or the template engine of the program that makes the page.
css:
  status: n/a
  reason: a style sheet does not take outside input; a value that a program puts into CSS is a separate context, protected with an allow-list of values for the property.
regex:
  status: n/a
  reason: a pattern does not make a page; a regex filter that removes tags from input is not a defence, because CWE-79 lists input validation as limited.
