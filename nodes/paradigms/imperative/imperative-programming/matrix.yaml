typescript:
  status: native
  reason: as JavaScript, with readonly properties and arrays checked at compile time.
kotlin:
  status: native
  reason: var declares a variable that can change and val one that cannot, with for, while and do-while loops; no example file because kotlinc is not installed on the machine that recorded the examples.
powershell:
  status: native
  reason: a script is a sequence of statements with variables, assignment, loops and conditionals; no example file because pwsh is not installed on the machine that recorded the examples.
sql:
  status: idiom
  reason: a query is declarative, but INSERT, UPDATE and DELETE change stored tables in sequence, and procedural extensions such as PL/pgSQL and T-SQL add variables and loops.
regex:
  status: n/a
  reason: a regular expression describes text and has no state or statements.
html:
  status: n/a
  reason: HTML describes a document and has no statements.
css:
  status: n/a
  reason: CSS declares styles and has no statements.
