typescript:
  status: native
  reason: TypeScript has the for...of and for...in loops of JavaScript, and the type of the loop variable comes from the iterable. No example file exists.
kotlin:
  status: native
  reason: Kotlin has for (x in collection) over anything with an iterator() operator, and withIndex() adds the index. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: Bash has for name in words, and for x in "${array[@]}" loops over the elements of an array. No example file exists.
powershell:
  status: native
  reason: PowerShell has foreach ($x in $items) and the ForEach-Object cmdlet for pipelines. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A query applies to each row of a set with no loop. Cursors in procedural extensions loop over the rows of a query.
regex:
  status: n/a
  reason: A regular expression has no collections to loop over.
html:
  status: n/a
  reason: HTML has no loops.
css:
  status: n/a
  reason: CSS has no loops. A selector applies a rule to each matching element.
