# The contract of the task "loop over nested loops" (spec 10.2). The function searches a grid with a loop inside a loop and stops both loops at the first match.
problem: loop-over-nested-loops
entry: find_in_grid
params:
  - name: grid
    type: "list<list<int>>"
    pre: "0 to 100 rows; each row has 0 to 100 integers; the rows can have different lengths"
  - name: target
    type: int
    pre: "any 32-bit signed integer"
returns:
  type: "tuple<int, int>"
  post: "the row and the column of the first cell in row-major order that equals target; (-1, -1) when no cell matches"
checker: exact
edge_classes: [first, last, order, missing, empty, ragged, negative]
