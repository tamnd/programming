typescript:
  status: native
  reason: TypeScript has the three-part for loop of JavaScript, and a let counter gets the type number. No example file exists.
kotlin:
  status: idiom
  reason: Kotlin has no three-part for loop. It loops over ranges with for (i in 1..10), until, downTo and step. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: Bash has the arithmetic loop for (( i = 0; i < n; i++ )) and for i in {1..10} over a brace expansion. No example file exists.
powershell:
  status: native
  reason: PowerShell has for ($i = 0; $i -lt 10; $i++) and foreach over a range such as 1..10. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A query has no loops. A function such as generate_series in PostgreSQL or a recursive common table expression makes a range of rows to join with.
regex:
  status: n/a
  reason: A regular expression has no counters. The quantifier {n} repeats a pattern n times.
html:
  status: n/a
  reason: HTML is a markup language and has no loops.
css:
  status: n/a
  reason: CSS has no loops. A selector such as :nth-child(2n+1) chooses every second element.
