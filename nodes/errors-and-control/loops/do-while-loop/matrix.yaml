typescript:
  status: native
  reason: TypeScript has the do...while loop of JavaScript, which runs its body before it tests the condition. No example file exists.
kotlin:
  status: native
  reason: Kotlin has do { } while (condition), whose body runs at least once. No example file exists because kotlinc is not installed.
bash:
  status: idiom
  reason: Bash has no do-while loop. The body can go into the condition list of a while loop with an empty body, because the exit status of the last command decides. No example file exists.
powershell:
  status: native
  reason: PowerShell has do { } while (condition) and do { } until (condition), which both test after the body. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A query has no loops. PL/pgSQL has LOOP with EXIT WHEN as the last statement, which tests after the body.
regex:
  status: n/a
  reason: A regular expression has no loops with conditions. Quantifiers repeat a part of a pattern.
html:
  status: n/a
  reason: HTML has no loops.
css:
  status: n/a
  reason: CSS has no loops.
