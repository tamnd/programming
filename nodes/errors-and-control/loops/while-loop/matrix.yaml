typescript:
  status: native
  reason: TypeScript has the while loop of JavaScript, and a type test in the condition narrows the type in the body. No example file exists.
kotlin:
  status: native
  reason: Kotlin has while (condition) with a Boolean condition. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: Bash runs the body of while as long as a command succeeds, and the body of until as long as it fails. while read -r line reads a file line by line. No example file exists.
powershell:
  status: native
  reason: PowerShell has while (condition). No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A query has no loops. T-SQL and PL/pgSQL have a WHILE loop in procedures.
regex:
  status: n/a
  reason: A regular expression has no state to test. A quantifier such as * repeats a pattern as long as it matches.
html:
  status: n/a
  reason: HTML is a markup language and has no loops.
css:
  status: n/a
  reason: CSS has no loops.
