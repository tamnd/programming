typescript:
  status: native
  reason: TypeScript has the loops of JavaScript, for, while, do...while, for...of and for...in, and the type checker gives the loop variable a type. No example file exists.
kotlin:
  status: native
  reason: Kotlin has for over ranges and iterables, while and do-while, and labels such as break@outer. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: Bash has for over a list of words, an arithmetic for with three expressions, while, and until, which loops while a command fails. No example file exists.
powershell:
  status: native
  reason: PowerShell has for, foreach, while, do-while and do-until, and the ForEach-Object cmdlet runs a block for each object in a pipeline. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A query works on all the rows of a set, so it needs no loop. A recursive common table expression repeats a query, and the procedural extensions such as PL/pgSQL have LOOP, WHILE and FOR.
regex:
  status: idiom
  reason: The quantifiers *, + and {n,m} repeat a part of a pattern, which is the only repetition in a regular expression.
html:
  status: n/a
  reason: HTML has no loops. A script or a template language repeats content.
css:
  status: n/a
  reason: CSS has no loops. A rule applies to all the elements that its selector matches, and preprocessors such as Sass add loops that run before the browser reads the file.
