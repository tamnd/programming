kotlin:
  status: native
  reason: Kotlin uses exceptions, with no checked exceptions. The standard library has the type Result and the function runCatching for code that returns an error as a value, and functions such as toIntOrNull return null for a failure. No example file exists because kotlinc is not installed.
powershell:
  status: native
  reason: PowerShell uses two strategies. A terminating error stops the statement and goes to try and catch or a trap. A non-terminating error goes to the error stream, and the command goes on. The preference variable $ErrorActionPreference selects between them. No example file exists because pwsh is not installed.
sql:
  status: native
  reason: A database reports an error in a statement with an error code and a message, and the statement has no effect. Procedural extensions such as PL/pgSQL and T-SQL add exception handlers. No example file exists.
regex:
  status: n/a
  reason: A regular expression has no error mechanism of its own.
html:
  status: n/a
  reason: HTML has no error mechanism for a program. A parser recovers from errors in markup.
css:
  status: n/a
  reason: CSS has no error mechanism for a program. A parser ignores a declaration that it cannot read.
