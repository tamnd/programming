typescript:
  status: native
  reason: TypeScript has the control flow statements of JavaScript, and the compiler follows each path to narrow the types of variables, for example after a test for null. No example file exists.
kotlin:
  status: native
  reason: Kotlin has if, when, for, while, do while and try, and if, when and try are expressions that give values. break, continue and return take labels. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: Bash has if, case, while, until, for, select, break and continue, and the exit status of a command decides each branch. No example file exists.
powershell:
  status: native
  reason: PowerShell has if, switch, while, do, for, foreach, labeled break and continue, try, catch and finally, and the trap statement. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A SQL query states a result and not an order of steps. CASE chooses a value in an expression, and procedural extensions such as PL/pgSQL add IF, LOOP and WHILE. No example file exists.
regex:
  status: idiom
  reason: A regex engine tries alternatives with | and repeats with *, + and ?, and a backtracking engine goes back to try another path when a match fails.
html:
  status: n/a
  reason: An HTML document describes content and does not run statements, so it has no control flow.
css:
  status: n/a
  reason: CSS rules have no order of execution. The cascade, specificity and conditional rules such as @media decide which declarations apply.
