c:
  status: absent
  reason: a C program has no type information at run time.
  alternative: a table of field names, offsets and types, written by hand or by a generator.
kotlin:
  status: native
  reason: the language reference describes class references with ::class and callable references; the library kotlin-reflect adds full introspection. No example file because kotlinc is not installed on the machine that recorded the examples.
powershell:
  status: native
  reason: PowerShell runs on .NET and objects expose their members; no example file because pwsh is not installed on the machine that recorded the examples.
bash:
  status: absent
  reason: the shell has strings and arrays, not objects with types.
sql:
  status: idiom
  reason: the standard information schema describes tables and columns as tables that a query can read.
regex:
  status: n/a
  reason: a pattern has no types or members.
html:
  status: n/a
  reason: markup has no program to inspect.
css:
  status: n/a
  reason: style rules have no program to inspect.
