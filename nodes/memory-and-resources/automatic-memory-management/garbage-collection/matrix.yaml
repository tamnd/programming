c:
  status: absent
  reason: the standard library has malloc and free and no collector.
  alternative: free each object by hand, use an arena, or link the Boehm-Demers-Weiser conservative collector.
bash:
  status: n/a
  reason: the shell manages its own strings and arrays, and a script has no references to objects.
sql:
  status: n/a
  reason: the database engine manages storage, and a query has no object references.
regex:
  status: n/a
  reason: a pattern has no objects.
html:
  status: n/a
  reason: markup has no objects; the DOM belongs to the JavaScript engine.
css:
  status: n/a
  reason: style rules have no objects.
