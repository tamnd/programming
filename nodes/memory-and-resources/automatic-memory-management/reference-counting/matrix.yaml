kotlin:
  status: idiom
  reason: Kotlin/JVM and Kotlin/Native free memory with a tracing collector, and objects have no reference counts; a count for a shared resource uses AtomicInteger on the JVM, as in Java; no example file because kotlinc is not installed on the machine that recorded the examples.
  alternative: use for a resource with one owner, which closes it at the end of a scope.
powershell:
  status: absent
  reason: the .NET collector frees objects, and a script has no reference counts; no example file because pwsh is not installed on the machine that recorded the examples.
  alternative: dispose a shared resource in a finally block, or call System.Threading.Interlocked from a .NET class as in C#.
bash:
  status: n/a
  reason: a script holds strings and arrays, not references to objects.
  alternative: the file system counts the hard links of a file, and it frees the file when the count is 0 and no process has the file open.
sql:
  status: n/a
  reason: a query has no references to objects; the database engine manages its own storage.
regex:
  status: n/a
  reason: a pattern has no objects.
html:
  status: n/a
  reason: markup has no objects; the DOM belongs to the JavaScript engine.
css:
  status: n/a
  reason: style rules have no objects.
