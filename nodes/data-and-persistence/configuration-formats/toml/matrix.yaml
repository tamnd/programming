c:
  status: library
  reason: ISO C has no TOML functions in its standard library.
  alternative: a third-party C library, or toml++ from C++.
cpp:
  status: library
  reason: the C++ standard library has no TOML; no example file because the vcpkg dependencies do not run on the machine that recorded the examples.
  alternative: toml++ (tomlplusplus), a C++17 library that can be used header-only and supports TOML 1.1.0.
csharp:
  status: library
  reason: .NET has no TOML API in its base class library.
  alternative: Tomlyn, a .NET library for TOML 1.1.0.
go:
  status: library
  reason: the Go standard library has no TOML package.
  alternative: github.com/BurntSushi/toml or github.com/pelletier/go-toml/v2, which both support TOML 1.1.0.
javascript:
  status: library
  reason: JavaScript and Node.js have no TOML parser built in.
  alternative: smol-toml, a parser and writer for TOML 1.1.0.
typescript:
  status: library
  reason: TypeScript has no TOML parser built in; it uses the JavaScript libraries.
  alternative: smol-toml, the same library as for JavaScript.
kotlin:
  status: library
  reason: the Kotlin standard library has no TOML.
  alternative: ktoml for kotlinx.serialization, or TomlJ on the JVM (see the Java example).
powershell:
  status: library
  reason: PowerShell has no TOML cmdlets.
  alternative: a .NET library such as Tomlyn, or the command-line tool yq.
sql:
  status: n/a
  reason: SQL has no TOML functions; a database stores TOML only as text.
bash:
  status: library
  reason: Bash has no TOML parser.
  alternative: the command-line tool yq, which reads and writes TOML.
regex:
  status: n/a
  reason: a regular expression cannot parse the nested tables and the multi-line strings of TOML, and a pattern has no values to serialise.
html:
  status: n/a
  reason: markup has no data values to serialise.
css:
  status: n/a
  reason: style sheets have no data values to serialise.
