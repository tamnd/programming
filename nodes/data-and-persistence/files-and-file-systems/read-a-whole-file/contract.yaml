# The contract of the task "read a whole file". Each solution reads all of the file in one call and returns its text with no change: line ends, a byte order mark and final newlines stay as they are in the file.
problem: read-a-whole-file
entry: read_text
params:
  - name: path
    type: string
    pre: "the path of a file of UTF-8 text, relative to the node directory; the file is small enough to keep in memory"
returns:
  type: string
  post: "the decoded text of all of the file, code point for code point; CR LF stays CR LF, a byte order mark stays U+FEFF, and the empty file gives the empty string"
checker: exact
edge_classes: [empty, no-final-newline, trailing-newlines, line-ends, bom, whitespace, non-ascii]
# The toolchain has no field for errors yet. cases/errors.jsonl holds the inputs on which each solution must report an error and return no text: not-found when the file does not exist, not-a-file when the path names a directory, invalid-utf8 when the bytes are not valid UTF-8.
