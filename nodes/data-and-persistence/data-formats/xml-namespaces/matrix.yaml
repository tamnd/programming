javascript:
  status: library
  reason: Node.js has no built-in XML parser; in browsers, the DOM of DOMParser has namespaceURI and localName on each element and getElementsByTagNameNS.
  alternative: a package such as @xmldom/xmldom, which implements the DOM namespace methods.
typescript:
  status: library
  reason: TypeScript has the same runtime as JavaScript; Node.js has no built-in XML parser.
  alternative: a package such as @xmldom/xmldom, which implements the DOM namespace methods.
rust:
  status: library
  reason: the Rust standard library has no XML parser.
  alternative: the crate quick-xml has a namespace-aware reader, and roxmltree gives each node a namespace and a local name.
c:
  status: library
  reason: ISO C has no XML functions.
  alternative: libxml2 (the field ns of each node) or Expat (XML_ParserCreateNS).
cpp:
  status: library
  reason: the C++ standard library has no XML parser.
  alternative: the C libraries libxml2 and Expat; pugixml leaves prefixes in the names and does not resolve namespaces.
kotlin:
  status: library
  reason: the Kotlin standard library has no XML; on the JVM a program can use the JAXP classes of Java, as in the Java example. No example file exists because kotlinc is not installed.
  alternative: the JAXP API of the Java platform.
bash:
  status: library
  reason: Bash has no XML parser.
  alternative: xmllint --xpath with local-name(), or xmlstarlet sel with -N to bind a prefix.
powershell:
  status: stdlib
  reason: Select-Xml takes a -Namespace hash table that binds prefixes for its XPath query; no example file because PowerShell is not installed on the machine that recorded the examples.
sql:
  status: native
  reason: SQL/XML has the clause XMLNAMESPACES to declare namespaces in XMLELEMENT and XMLTABLE; SQLite has no XML functions.
regex:
  status: n/a
  reason: a regular expression cannot resolve the scope of namespace declarations.
html:
  status: n/a
  reason: the HTML syntax has no namespace declarations; the HTML parser puts the elements in the XHTML namespace, and the svg and math elements in their own namespaces.
css:
  status: n/a
  reason: CSS has the @namespace rule for selectors on XML documents, but no data to parse.
