javascript:
  status: library
  reason: Node.js has no XML parser; browsers have DOMParser and XMLSerializer.
  alternative: the DOMParser and XMLSerializer of the package @xmldom/xmldom.
typescript:
  status: library
  reason: TypeScript has the same runtime as JavaScript, and Node.js has no XML parser.
  alternative: the DOMParser and XMLSerializer of the package @xmldom/xmldom.
rust:
  status: library
  reason: the Rust standard library has no XML parser.
  alternative: the crate quick-xml, which has a pull reader and a writer.
c:
  status: library
  reason: ISO C has no XML functions.
  alternative: libxml2, with xmlReadMemory and xmlC14NDocDumpMemory for Canonical XML.
cpp:
  status: library
  reason: the C++ standard library has no XML parser.
  alternative: pugixml (xml_document::load_string and save) or libxml2.
kotlin:
  status: library
  reason: the Kotlin standard library has no XML parser; on the JVM a program can use javax.xml.parsers, as in the Java solution. No example file exists because kotlinc is not installed.
  alternative: the javax.xml.parsers API of the Java platform.
bash:
  status: library
  reason: Bash has no XML parser.
  alternative: xmllint --c14n of libxml2, or xmlstarlet c14n.
powershell:
  status: stdlib
  reason: the type accelerator [xml] parses a text into a System.Xml.XmlDocument, which a script can walk as the C# solution does; no example file because PowerShell is not installed on the machine that recorded the examples.
