python:
  status: library
  reason: the Python standard library has no YAML module; no example file because the runner skips Python dependencies, and the node page shows the resolution rules with the module re.
  alternative: PyYAML, a YAML 1.1 parser with yaml.safe_load, or ruamel.yaml, which keeps comments on a round trip.
javascript:
  status: library
  reason: ECMAScript and Node.js have no YAML parser; no example file because the runner skips JavaScript dependencies.
  alternative: the npm packages js-yaml or yaml.
typescript:
  status: library
  reason: TypeScript has no YAML parser; no example file because the runner skips JavaScript dependencies.
  alternative: the npm packages js-yaml or yaml.
go:
  status: library
  reason: the Go standard library has no YAML package; no example file because the runner skips Go dependencies.
  alternative: go-yaml, the fork that the YAML organization keeps of github.com/go-yaml/yaml.
csharp:
  status: library
  reason: .NET has no YAML API; no example file because the runner skips NuGet dependencies.
  alternative: YamlDotNet.
cpp:
  status: library
  reason: the C++ standard library has no YAML; no example file because the runner skips vcpkg dependencies on this machine.
  alternative: yaml-cpp.
c:
  status: library
  reason: ISO C has no YAML functions in its standard library.
  alternative: LibYAML, which the YAML organization keeps.
kotlin:
  status: library
  reason: the Kotlin standard library has no YAML.
  alternative: a JVM library such as SnakeYAML or SnakeYAML Engine, as in the Java example.
sql:
  status: absent
  reason: the SQL standard and SQLite have no YAML functions.
  alternative: convert YAML to JSON outside the database and use the JSON functions.
bash:
  status: library
  reason: Bash has no YAML parser.
  alternative: the command-line tool yq.
powershell:
  status: library
  reason: the module Microsoft.PowerShell.Utility has ConvertFrom-Json and ConvertFrom-Csv but no YAML cmdlet.
  alternative: the module powershell-yaml.
regex:
  status: n/a
  reason: a regular expression cannot match the nested, indentation-based structure of YAML; patterns can only resolve single plain scalars, as the node page shows.
html:
  status: n/a
  reason: markup has no data values to serialise.
css:
  status: n/a
  reason: style sheets have no data values to serialise.
