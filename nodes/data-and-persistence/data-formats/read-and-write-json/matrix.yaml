java:
  status: library
  reason: The Java SE API has no JSON parser.
  alternative: a library such as Jackson or Gson.
rust:
  status: library
  reason: The Rust standard library has no JSON parser.
  alternative: the crate serde_json.
c:
  status: library
  reason: ISO C has no JSON functions in its standard library.
  alternative: a library such as cJSON or Jansson.
cpp:
  status: library
  reason: The C++ standard library has no JSON parser.
  alternative: the library nlohmann/json.
bash:
  status: library
  reason: Bash has no JSON parser.
  alternative: the command-line tool jq.
