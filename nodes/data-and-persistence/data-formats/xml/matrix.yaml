javascript:
  status: library
  reason: ECMAScript has no XML parser; browsers have DOMParser and XMLSerializer, and Node.js has no built-in XML module.
  alternative: a package such as fast-xml-parser or @xmldom/xmldom in Node.js.
typescript:
  status: library
  reason: TypeScript has the same runtime as JavaScript; the DOM type definitions describe DOMParser for browsers, and Node.js has no built-in XML module.
  alternative: a package such as fast-xml-parser or @xmldom/xmldom in Node.js.
rust:
  status: library
  reason: the Rust standard library has no XML parser.
  alternative: the crates quick-xml (a pull parser and writer) and roxmltree (a read-only tree).
c:
  status: library
  reason: ISO C has no XML functions in its standard library.
  alternative: the libraries libxml2 or Expat.
cpp:
  status: library
  reason: the C++ standard library has no XML parser.
  alternative: a library such as pugixml or TinyXML-2, or the C libraries libxml2 and Expat.
kotlin:
  status: library
  reason: the Kotlin standard library has no XML; on the JVM a program can use the JAXP classes of Java, as in the Java example. No example file exists because kotlinc is not installed.
  alternative: the JAXP API of the Java platform, or a library such as xmlutil for kotlinx.serialization.
bash:
  status: library
  reason: Bash has no XML parser.
  alternative: the command-line tools xmllint (from libxml2) and xmlstarlet.
powershell:
  status: stdlib
  reason: the type accelerator [xml] casts a string to a System.Xml.XmlDocument, and the cmdlet Select-Xml runs XPath queries; no example file because PowerShell is not installed on the machine that recorded the examples.
sql:
  status: native
  reason: the SQL standard part SQL/XML (ISO/IEC 9075-14) defines the XML type and functions such as XMLELEMENT, XMLQUERY and XMLTABLE; SQLite has no XML functions.
regex:
  status: n/a
  reason: a regular expression cannot match the nested structure of XML in general, and a pattern has no values to serialise.
html:
  status: n/a
  reason: HTML is a separate markup language with its own parser rules; XHTML is HTML in the XML syntax.
css:
  status: n/a
  reason: style sheets have no data values to serialise; a CSS style sheet can style an XML document.
