typescript:
  status: native
  reason: TypeScript runs on a JavaScript runtime and uses its JSON object. The static types are erased, so JSON.parse returns a value of type any and the program must check the shape itself. No example file exists, because the JavaScript example applies.
kotlin:
  status: library
  reason: the Kotlin standard library has no data format; on the JVM a program can use the XML and binary stream classes of Java, and the official kotlinx.serialization library adds JSON and other formats. No example file exists because kotlinc is not installed.
  alternative: kotlinx.serialization, or the classes of java.xml and java.io.
rust:
  status: library
  reason: the Rust standard library has no data format. The serde framework separates the data structures from the formats, and crates such as serde_json, serde_cbor and quick-xml implement the formats. No example file exists; the JSON page has a serde_json example.
  alternative: serde with serde_json, or a crate for another format.
c:
  status: library
  reason: ISO C has no data format in its standard library. A program writes its own layout with fwrite and explicit byte order, or uses a library.
  alternative: a library such as cJSON or Jansson for JSON, libxml2 for XML, or protobuf-c for Protocol Buffers.
cpp:
  status: library
  reason: the C++ standard library has no data format. A program uses a library for each format.
  alternative: a library such as nlohmann/json for JSON, pugixml for XML, or the C++ runtime of Protocol Buffers.
bash:
  status: library
  reason: Bash handles lines of text, so it can split simple delimited lines with read and IFS, but it has no parser for quoted CSV, JSON or XML.
  alternative: the command-line tools jq for JSON and xmllint for XML.
powershell:
  status: stdlib
  reason: the cmdlets ConvertTo-Json, ConvertTo-Csv and ConvertTo-Xml, and ConvertFrom-Json and ConvertFrom-Csv, ship with PowerShell. No example file exists because pwsh is not installed on the machine that recorded the examples.
sql:
  status: native
  reason: the SQL standard defines JSON functions such as JSON_VALUE, JSON_QUERY and JSON_TABLE, and database systems add bulk load and export of CSV. A database stores rows in its own format, which is not an interchange format.
regex:
  status: n/a
  reason: a regular expression can check one token, such as a number or a date, but it cannot parse the nested structure of JSON or XML.
html:
  status: n/a
  reason: HTML is a document format, not a format for data records. A script element of type application/json can carry a JSON text inside a page.
css:
  status: n/a
  reason: style sheets hold no data records to exchange.
