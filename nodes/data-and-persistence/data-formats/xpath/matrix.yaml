go:
  status: library
  reason: the package encoding/xml of the Go standard library parses XML but has no XPath engine.
  alternative: a module such as github.com/antchfx/xmlquery, which evaluates XPath 1.0 over a parsed tree.
javascript:
  status: native
  reason: browsers have document.evaluate and XPathExpression for XPath 1.0 over the DOM; Node.js has no built-in XPath.
  alternative: in Node.js, a package such as xpath over the DOM of @xmldom/xmldom.
typescript:
  status: native
  reason: TypeScript has the same runtime as JavaScript, so a browser program has document.evaluate and Node.js has no built-in XPath.
  alternative: in Node.js, a package such as xpath over the DOM of @xmldom/xmldom.
rust:
  status: library
  reason: the Rust standard library has no XML parser and no XPath.
  alternative: the crate sxd-xpath, or the bindings of the crate libxml to libxml2.
c:
  status: library
  reason: ISO C has no XML functions.
  alternative: libxml2, with xmlXPathNewContext and xmlXPathEvalExpression.
cpp:
  status: library
  reason: the C++ standard library has no XML parser.
  alternative: pugixml (select_nodes) or libxml2.
kotlin:
  status: library
  reason: the Kotlin standard library has no XPath; on the JVM a program can use javax.xml.xpath, as in the Java example. No example file exists because kotlinc is not installed.
  alternative: the javax.xml.xpath API of the Java platform.
bash:
  status: library
  reason: Bash has no XML parser.
  alternative: xmllint --xpath of libxml2, or xmlstarlet sel.
powershell:
  status: stdlib
  reason: the cmdlet Select-Xml finds the nodes that match an XPath query; no example file because PowerShell is not installed on the machine that recorded the examples.
sql:
  status: native
  reason: SQL/XML has XMLQUERY, XMLEXISTS and XMLTABLE, which take XQuery expressions, and XPath is a subset of XQuery; SQLite has no XML functions.
regex:
  status: n/a
  reason: a regular expression matches text and cannot follow the tree structure that XPath selects from.
html:
  status: n/a
  reason: HTML is a document format, not a query language; a browser can evaluate XPath over the DOM of an HTML page with document.evaluate.
css:
  status: n/a
  reason: CSS selectors also select elements of a tree, but they do not compute values such as counts and sums.
