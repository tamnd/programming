typescript:
  status: idiom
  reason: TypeScript has no ring buffer type. A class keeps an array, a start index and a count, as in the JavaScript example. No example file exists.
kotlin:
  status: idiom
  reason: Kotlin has no fixed ring buffer type. A class over an array, or ArrayDeque with a size check, does the work. No example file exists because kotlinc is not installed.
powershell:
  status: idiom
  reason: A .NET array with a start index and a count works as a ring buffer. No example file exists because pwsh is not installed.
bash:
  status: idiom
  reason: An indexed array with an index that wraps with the % operator works as a ring buffer. No example file exists.
sql:
  status: idiom
  reason: A table can keep only its newest rows if the program deletes the oldest rows after each insert. SQL has no ring buffer type.
regex:
  status: n/a
  reason: A regular expression matches text. It has no data structures.
html:
  status: n/a
  reason: HTML is markup. It has no data structures for a program.
css:
  status: n/a
  reason: CSS style rules have no data structures.
