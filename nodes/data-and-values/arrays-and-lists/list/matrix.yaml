typescript:
  status: native
  reason: TypeScript uses the JavaScript Array, typed as T[] or Array<T>. ReadonlyArray<T> and readonly T[] remove the mutating methods from the type. No example file exists.
kotlin:
  status: stdlib
  reason: List<T> is a read-only interface and MutableList<T> adds the mutators. listOf and mutableListOf make them, and on the JVM the usual implementation is java.util.ArrayList. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: An indexed array such as a=(x y z) is the list type, and "$@" is the list of arguments. No example file exists.
powershell:
  status: native
  reason: "@(...) makes an array, and [System.Collections.Generic.List[T]] gives the .NET list with Add and Insert. No example file exists because pwsh is not installed."
sql:
  status: idiom
  reason: A table has no order of its own. Rows with an ordering column and ORDER BY give a list. Some databases also have array column types.
regex:
  status: n/a
  reason: A regular expression matches text. It has no lists.
html:
  status: native
  reason: ol, ul and li elements display a list. They are markup, not a data type.
css:
  status: n/a
  reason: CSS style rules have no lists. list-style only styles HTML lists.
