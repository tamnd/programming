# The contract of the task "append to a list" (spec 10.2). The function returns a new list, and the input list does not change.
problem: append-to-a-list
entry: insert_at
params:
  - name: items
    type: "list<int>"
    pre: "a list of 0 to 1000 32-bit signed integers"
  - name: index
    type: "int"
    pre: "0 <= index <= len(items); index len(items) adds the value at the end"
  - name: value
    type: "int"
    pre: "a 32-bit signed integer"
returns:
  type: "list<int>"
  post: "a new list of length len(items) + 1: items[0:index], then value, then items[index:]"
checker: exact
edge_classes: [empty, single, boundary, duplicates, limit]
