typescript:
  status: native
  reason: TypeScript uses the JavaScript Array, typed as T[] or Array<T>. push, pop and length work as in JavaScript. No example file exists.
kotlin:
  status: stdlib
  reason: mutableListOf and ArrayList<E> give a dynamic array. On the JVM, kotlin.collections.ArrayList is java.util.ArrayList. No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: An indexed array grows with a+=(x) or with an assignment to a new index. Bash does not store it as a contiguous array, and it has no capacity. No example file exists.
powershell:
  status: stdlib
  reason: "[System.Collections.Generic.List[int]]::new() gives the .NET List<T> with Add and Capacity. The += operator on a PowerShell array makes a new array each time. No example file exists because pwsh is not installed."
sql:
  status: n/a
  reason: A table grows by rows, and the database manages the storage. Array column values in databases that have them are values, not growable buffers.
regex:
  status: n/a
  reason: A regular expression matches text. It has no collections.
html:
  status: n/a
  reason: HTML is markup. It has no collections.
css:
  status: n/a
  reason: CSS style rules have no collections.
