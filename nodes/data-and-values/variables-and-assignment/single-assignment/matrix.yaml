typescript:
  status: native
  reason: TypeScript has the const of JavaScript, and readonly properties that the compiler checks. No example file exists.
kotlin:
  status: native
  reason: val declares a name that is assigned once, and the compiler rejects a second assignment. No example file exists because kotlinc is not installed.
bash:
  status: idiom
  reason: readonly NAME=value, or declare -r NAME=value, makes a variable that cannot get a new value. No example file exists.
powershell:
  status: idiom
  reason: "Set-Variable with the option ReadOnly or Constant makes a variable that cannot get a new value. No example file exists because pwsh is not installed."
sql:
  status: native
  reason: A query has no variables that change. Each name of a common table expression in a WITH clause is defined once. No example file exists.
regex:
  status: n/a
  reason: A pattern has no variables.
html:
  status: n/a
  reason: HTML is markup, with no variables.
css:
  status: n/a
  reason: A custom property can get a new value in each rule, and the cascade picks one.
