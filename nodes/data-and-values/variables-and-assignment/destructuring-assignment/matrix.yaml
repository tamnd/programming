typescript:
  status: native
  reason: TypeScript has the array and object patterns of JavaScript, and the compiler checks the types of the parts. No example file exists.
kotlin:
  status: native
  reason: "val (a, b) = pair calls the functions component1 and component2, which data classes, pairs and map entries have. No example file exists because kotlinc is not installed."
bash:
  status: idiom
  reason: "read -r a b <<< \"$line\" splits a line into words and assigns them to names. No example file exists."
powershell:
  status: native
  reason: "$a, $b = 1, 2 assigns several values at once, and the last name collects the rest. No example file exists because pwsh is not installed."
sql:
  status: n/a
  reason: A query selects columns by name, with no assignment of the parts of a value.
regex:
  status: idiom
  reason: Capture groups take the parts of a match, and named groups give the parts names.
html:
  status: n/a
  reason: HTML is markup, with no variables.
css:
  status: n/a
  reason: CSS has no variables to bind.
