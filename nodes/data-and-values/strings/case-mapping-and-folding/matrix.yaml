typescript:
  status: native
  reason: TypeScript uses the JavaScript methods toUpperCase, toLowerCase, toLocaleUpperCase and toLocaleLowerCase. No example file exists.
kotlin:
  status: native
  reason: Kotlin has uppercase() and lowercase(), which take an optional Locale, and equals(other, ignoreCase = true). No example file exists because kotlinc is not installed.
bash:
  status: native
  reason: The expansions ${s^^} and ${s,,} change the case of each character by the locale. In a C.UTF-8 locale, ${s^^} keeps ß as ß. No example file exists.
powershell:
  status: native
  reason: PowerShell strings are .NET strings, so ToUpper, ToLower and ToUpperInvariant work. The operator -eq ignores case, and -ceq does not. No example file exists because pwsh is not installed.
sql:
  status: native
  reason: UPPER and LOWER change the case. A comparison that ignores case depends on the collation of the column. No example file exists.
regex:
  status: native
  reason: The flag i, or the inline (?i), makes a match ignore case. Each engine decides whether it uses ASCII, simple or full case folding.
html:
  status: n/a
  reason: HTML has no string operations. The case of the text on the page comes from the text or from CSS.
css:
  status: native
  reason: The property text-transform with the values uppercase, lowercase and capitalize changes the case of the text when the browser draws it. No example file exists.
