# The contract of the task "count the graphemes of a string" (spec 10.2). A grapheme is an extended grapheme cluster of UAX #29. The contract has a small set of code points, and the Grapheme_Cluster_Break value and the Extended_Pictographic value of each one come from the Unicode 18.0 data files.
# The set: U+0000 to U+00FF, U+0300 to U+036F (Extend), U+200D (ZWJ), U+2764, U+FE00 to U+FE0F (Extend), U+1F1E6 to U+1F1FF (Regional_Indicator), U+1F3FB to U+1F3FF (Extend), U+1F400 to U+1F4FD and U+1F600 to U+1F64F.
# Extended_Pictographic: U+00A9, U+00AE, U+2764, U+1F400 to U+1F4FD and U+1F600 to U+1F64F. Control: U+0000 to U+001F, U+007F to U+009F and U+00AD, but not CR and LF.
problem: count-the-graphemes-of-a-string
entry: count_graphemes
params:
  - name: s
    type: string
    pre: "each code point of s is in the set of this contract"
returns:
  type: int
  post: "the number of extended grapheme clusters in s, by the rules GB3, GB4, GB5, GB9, GB11, GB12, GB13 and GB999 of UAX #29"
checker: exact
edge_classes: [combining, crlf, control, regional-indicator, zwj, modifier]
