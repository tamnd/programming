typescript:
  status: idiom
  reason: a Map from the primary key to the loaded object in each mapper or session; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: Entity Framework Core does identity resolution in tracking queries, so a DbContext returns one instance for each key; by hand, a Dictionary from the key to the object.
  alternative: the Java example.
cpp:
  status: idiom
  reason: an unordered_map from the key to a shared_ptr or a weak_ptr of the object; the standard library has no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: a hash table from the key to a pointer of the loaded struct, owned by one session.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: a HashMap from the key to the object, or the persistence context of a JPA provider; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: n/a
  reason: SQL rows have no object identity in memory; the primary key is the only identity, and the map belongs to the client language.
bash:
  status: n/a
  reason: the shell has no objects to load.
powershell:
  status: idiom
  reason: a hashtable from the key to the loaded object in a session object; no example is executed here because the test image has no pwsh.
  alternative: the Java example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no objects or tables of data.
css:
  status: n/a
  reason: style rules have no data access.
