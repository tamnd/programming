typescript:
  status: idiom
  reason: JSON.stringify and JSON.parse with typed classes, and an ORM column of type json; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: System.Text.Json serializes the graph into one column, and Entity Framework Core can map an owned type to a JSON column.
  alternative: the Java example.
cpp:
  status: idiom
  reason: the program writes the graph to one text or binary value; the standard library has no JSON and no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: the program writes the graph to one buffer and binds it to a TEXT or BLOB column with the SQLite C API.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: kotlinx.serialization writes the graph of data classes to one JSON value; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: idiom
  reason: the TEXT, BLOB or JSON column is the database side of the pattern; the graph of objects belongs to the client language.
  alternative: the Python example, which declares the column in SQLite.
bash:
  status: n/a
  reason: the shell has no object graphs to serialize into a column.
powershell:
  status: idiom
  reason: ConvertTo-Json and ConvertFrom-Json turn a tree of objects into one JSON value and back; no example is executed here because the test image has no pwsh.
  alternative: the JavaScript example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no object graph saved to a database.
css:
  status: n/a
  reason: style rules have no data access.
