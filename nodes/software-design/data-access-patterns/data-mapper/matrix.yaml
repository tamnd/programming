typescript:
  status: idiom
  reason: plain classes for the domain and mapper or repository classes that hold the queries; TypeORM supports this form with its repositories; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: plain classes for the domain and a mapper class over ADO.NET commands with parameters; the Java example shows the same design.
  alternative: the Java example, with records for the stored rows.
cpp:
  status: idiom
  reason: plain classes for the domain and a mapper class over a database client library; the standard library has no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: a struct for the domain data and mapper functions that take a connection and the struct; the domain functions do not see the connection.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: data classes for the domain and a mapper class that holds the queries; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: n/a
  reason: SQL is the language of the statements that the mapper runs; the domain objects belong to the client language.
bash:
  status: n/a
  reason: the shell has no objects to map to rows.
powershell:
  status: idiom
  reason: classes for the domain and a mapper class over database commands; no example is executed here because the test image has no pwsh.
  alternative: the Java example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no objects or tables of data to map.
css:
  status: n/a
  reason: style rules have no data access.
