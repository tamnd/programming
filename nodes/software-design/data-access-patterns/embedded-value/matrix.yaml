typescript:
  status: idiom
  reason: a readonly value class or a frozen object, written to columns of the owner's row by hand or by an ORM; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: Entity Framework Core maps a record or a struct as a complex type, or as an owned type, to columns of the owner's table.
  alternative: the Java example.
cpp:
  status: idiom
  reason: a struct with value semantics and operator==, written to columns by the program; the standard library has no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: a struct copied by value and bound to several columns with the SQLite C API.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: a data class holds the value and a mapper writes its fields to the owner's columns; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: idiom
  reason: the group of columns in the owner's table is the database side of the pattern; the value object belongs to the client language.
  alternative: the Python example, which declares the columns in SQLite.
bash:
  status: n/a
  reason: the shell has no value objects to map.
powershell:
  status: idiom
  reason: a class for the value and a function that writes its fields to the owner's columns; no example is executed here because the test image has no pwsh.
  alternative: the Java example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no objects mapped to database rows.
css:
  status: n/a
  reason: style rules have no data access.
