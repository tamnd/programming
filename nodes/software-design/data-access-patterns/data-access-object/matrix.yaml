typescript:
  status: idiom
  reason: an interface for the DAO and classes that implement it, with the transfer object as a type; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: an interface such as IPlayerDao with an implementation over ADO.NET or Dapper, given to the business code by dependency injection.
  alternative: the Java example.
cpp:
  status: idiom
  reason: an abstract class with pure virtual functions and a class for each data source; the standard library has no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: a struct of function pointers serves as the interface, with one set of functions for each data source over the SQLite C API.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: an interface with the @Dao annotation is the usual form on Android, and Room generates the class; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: n/a
  reason: the DAO hides the SQL from the business code; SQL itself has no interfaces to put in front of a table.
bash:
  status: n/a
  reason: the shell has no interfaces or objects for a DAO.
powershell:
  status: idiom
  reason: a PowerShell class with the persistence methods, and a second class with the same methods for another store; no example is executed here because the test image has no pwsh.
  alternative: the Java example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no data access objects.
css:
  status: n/a
  reason: style rules have no data access.
