typescript:
  status: idiom
  reason: an object reference in memory and a key column in the row, mapped by hand or by an ORM; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: Entity Framework Core maps a navigation property to a foreign key property, which can also be a shadow property.
  alternative: the Java example.
cpp:
  status: idiom
  reason: a pointer or a smart pointer in memory and a key in the row, mapped by the program; the standard library has no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: a struct pointer in memory and an integer key in the row, mapped by hand with the SQLite C API.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: a class with a reference to the parent object and a mapper that writes its key; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: idiom
  reason: the foreign key column and its REFERENCES constraint are the database side of the pattern; the object side belongs to the client language.
  alternative: the Python example, which declares the constraint in SQLite.
bash:
  status: n/a
  reason: the shell has no objects with references to map.
powershell:
  status: idiom
  reason: a class with a reference to the parent object and a function that writes its key; no example is executed here because the test image has no pwsh.
  alternative: the Java example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no objects mapped to database rows.
css:
  status: n/a
  reason: style rules have no data access.
