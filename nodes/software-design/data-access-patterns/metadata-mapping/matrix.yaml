typescript:
  status: idiom
  reason: decorators or a typed map of field to column, read by a generic mapper; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: attributes such as [Table] and [Column], or a fluent mapping, read with reflection or by a source generator; Entity Framework Core keeps this metadata in its model.
  alternative: the Java example.
cpp:
  status: idiom
  reason: C++ has no standard run-time reflection, so a table of member pointers or generated code holds the mapping; the standard library has no database access.
  alternative: the Rust example.
c:
  status: idiom
  reason: an array of structs with the column name and the offset of each field from offsetof, read by one generic function that binds values with the SQLite C API.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: annotations read with kotlin-reflect, or code generated at compile time by an annotation processor; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: n/a
  reason: the metadata describes how client classes map to tables; SQL holds the tables, not the classes.
bash:
  status: n/a
  reason: the shell has no objects with fields to map.
powershell:
  status: idiom
  reason: a hashtable of property to column, read with the PSObject properties of each object; no example is executed here because the test image has no pwsh.
  alternative: the JavaScript example.
regex:
  status: n/a
  reason: a pattern has no objects and no storage.
html:
  status: n/a
  reason: markup has no mapped objects.
css:
  status: n/a
  reason: style rules have no data access.
