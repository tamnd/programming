typescript:
  status: library
  reason: database drivers return rows with field names; a typed class can keep them with the state of each row.
  alternative: the JavaScript example.
csharp:
  status: stdlib
  reason: the ADO.NET DataSet and DataTable keep tables of rows in memory, with constraints, relations and the state of each row.
  alternative: the Java example.
cpp:
  status: library
  reason: the standard library has no database access; a database library gives rows that a class can keep in memory.
  alternative: the Rust example.
c:
  status: library
  reason: a database client library such as the SQLite C interface gives the rows one by one; the program copies them into arrays.
  alternative: the Go example.
kotlin:
  status: stdlib
  reason: the Java CachedRowSet and JDBC work the same in Kotlin; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: native
  reason: the result of a query is a table of rows and named columns, and a temporary table keeps it for later statements.
  alternative: the Python example.
bash:
  status: idiom
  reason: a database command line tool prints the rows as lines with a separator, which a script reads into arrays.
  alternative: the Python example.
powershell:
  status: stdlib
  reason: the .NET DataTable is available in PowerShell, and Import-Csv gives objects with named properties; no example is executed here because the test image has no pwsh.
  alternative: the Python example.
regex:
  status: n/a
  reason: a pattern has no tables.
html:
  status: n/a
  reason: an HTML table shows rows, but it is markup and keeps no data model.
css:
  status: n/a
  reason: style rules have no tables of data.
