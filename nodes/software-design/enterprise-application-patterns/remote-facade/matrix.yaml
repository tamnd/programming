typescript:
  status: idiom
  reason: an HTTP or RPC handler with coarse-grained operations over the domain classes, which returns plain objects for JSON; the JavaScript example shows the same design without the types.
  alternative: the JavaScript example.
csharp:
  status: idiom
  reason: an ASP.NET Core controller or a gRPC service with coarse-grained methods that call the domain objects and return DTO classes.
  alternative: the Java example.
cpp:
  status: library
  reason: a coarse-grained service over gRPC or another RPC library; the standard library has no network calls or serialization.
  alternative: the Rust example.
c:
  status: library
  reason: a coarse-grained set of remote functions over an RPC or HTTP library, with hand-written encoding of the structs.
  alternative: the Go example.
kotlin:
  status: idiom
  reason: a Spring controller or a gRPC service with coarse-grained methods that return data classes; no example is executed here because the test image has no kotlinc.
  alternative: the Java example.
sql:
  status: n/a
  reason: SQL has no objects and no remote interfaces of its own.
bash:
  status: absent
  reason: the shell can call remote services with curl, but it has no objects to put behind a facade.
  alternative: the Python example.
powershell:
  status: idiom
  reason: a function for each coarse-grained operation that a remote client calls through a web endpoint or PowerShell remoting; no example is executed here because the test image has no pwsh.
  alternative: the Java example.
regex:
  status: n/a
  reason: a pattern has no objects and no remote calls.
html:
  status: n/a
  reason: markup has no objects and no remote calls.
css:
  status: n/a
  reason: style rules have no objects and no remote calls.
