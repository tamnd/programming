c:
  status: idiom
  reason: a struct with a pointer to a table of functions is the interface, and a proxy is a second struct with the same table that forwards to the real one; a lazy proxy checks a NULL pointer on each call.
kotlin:
  status: idiom
  reason: class delegation with "by" forwards every method of an interface to another object, so a proxy overrides only the methods it controls, and "by lazy" gives a lazy property; no example is executed here because the test image has no kotlinc.
  alternative: java.lang.reflect.Proxy, as in the Java example.
sql:
  status: idiom
  reason: a view stands in for a table and has the same query interface; a view that filters rows by the current user, with access granted on the view and not on the table, acts as a protection proxy.
bash:
  status: n/a
  reason: the shell has no objects with interfaces to stand in for; a wrapper function with the name of a command intercepts calls to that command, which is closer to a decorator.
powershell:
  status: idiom
  reason: a class that implements the same interface, or a proxy function made with the ProxyCommand class, stands in for a cmdlet or an object; no example is executed here because the test image has no pwsh.
regex:
  status: n/a
  reason: a pattern has no objects to stand in for.
html:
  status: n/a
  reason: markup has no objects with interfaces; lazy loading of images is an attribute of the img element, not a proxy object.
css:
  status: n/a
  reason: style rules have no objects to stand in for.
