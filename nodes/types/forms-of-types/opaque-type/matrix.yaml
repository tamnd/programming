  reason: Bash has no user-defined types.
powershell:
  status: idiom
  reason: PowerShell uses .NET access control, as in C#. No example file exists because pwsh is not installed.
sql:
  status: n/a
  reason: A query sees the columns of the tables it can read, and SQL has no user types with hidden parts.
regex:
  status: n/a
  reason: A regular expression has no types.
html:
  status: n/a
  reason: HTML has no types.
css:
  status: n/a
  reason: CSS has no types in this sense.
