typescript:
  status: idiom
  reason: TypeScript has private class members with # and private, and a module can export an interface without the class. No example file exists.
kotlin:
  status: idiom
  reason: Kotlin has private and internal members, and a factory can return an interface while the class stays private. No example file exists because kotlinc is not installed.
