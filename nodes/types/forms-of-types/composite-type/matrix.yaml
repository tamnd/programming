typescript:
  status: native
  reason: TypeScript has object types, array types such as number[], tuple types such as [string, number] and union types. The types describe JavaScript objects and arrays, so the run-time values are the same as in JavaScript. No example file exists.
kotlin:
  status: native
  reason: Kotlin has classes, data classes with generated equals and copy, Array<T>, Pair and Triple, and the List, Set and Map interfaces. No example file exists because kotlinc is not installed.
bash:
  status: idiom
  reason: Bash has indexed arrays and associative arrays, but their elements are strings, so an array cannot hold another array or a record. Scripts keep parallel arrays or encode a record in one string. No example file exists.
powershell:
  status: native
  reason: PowerShell has arrays, hashtables and [pscustomobject] for records, and it can use any .NET type, such as List[T] and tuples. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A row of a table is a record of column values, and a query result is a list of rows. Some databases add composite column types, such as arrays and row types, but support differs. No example file exists.
regex:
  status: n/a
  reason: A regular expression has groups that collect parts of a match, but the pattern language has no values and no types.
html:
  status: n/a
  reason: An element can contain other elements, which gives a document its structure, but HTML has no types of values.
css:
  status: idiom
  reason: A shorthand property such as border or font takes a value that combines values of other types, such as a length, a keyword and a color.
