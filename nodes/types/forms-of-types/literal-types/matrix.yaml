javascript:
  status: absent
  reason: JavaScript has no static types. A program can keep allowed values in a frozen object and test a value when it runs. No example file exists.
typescript:
  status: native
  reason: TypeScript has string, number, boolean and enum literal types, unions of them, and as const. No example file exists.
kotlin:
  status: idiom
  reason: Kotlin has enum classes for a fixed set of values, and an object declaration has one instance. No example file exists because kotlinc is not installed.
bash:
  status: n/a
  reason: Bash has no types.
powershell:
  status: idiom
  reason: PowerShell uses .NET enums. No example file exists because pwsh is not installed.
sql:
  status: idiom
  reason: A CHECK constraint with IN can limit a column to listed values. No example file exists.
regex:
  status: n/a
  reason: A regular expression has no types.
html:
  status: n/a
  reason: HTML has no types.
css:
  status: n/a
  reason: CSS keywords are fixed values, but CSS has no type system for them.
