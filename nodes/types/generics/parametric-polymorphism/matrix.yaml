c:
  status: absent
  reason: ISO C has no type parameters; _Generic selects an expression by type, which is ad hoc polymorphism.
  alternative: a void * argument with the size of an element and a comparison function, as in qsort.
bash:
  status: n/a
  reason: Bash has no static types, so there is nothing to parameterize.
sql:
  status: n/a
  reason: a query has no user-defined type parameters.
regex:
  status: n/a
  reason: a pattern has no types.
html:
  status: n/a
  reason: markup has no types.
css:
  status: n/a
  reason: style rules have no types.
