kotlin:
  status: native
  reason: a data class is a product by name, and the standard library has Pair and Triple for products by position; no example file because kotlinc is not installed on the machine that recorded the examples.
powershell:
  status: idiom
  reason: a pscustomobject or a class holds named properties, and an array holds values by position; no example file because pwsh is not installed on the machine that recorded the examples.
bash:
  status: n/a
  reason: Bash has no types, only strings and arrays of strings.
  alternative: one variable for each part, or an associative array with one key for each field.
sql:
  status: native
  reason: a row of a table is a product of its columns, and a row value such as (1, 'a') is a product by position.
regex:
  status: n/a
  reason: a pattern has no types.
html:
