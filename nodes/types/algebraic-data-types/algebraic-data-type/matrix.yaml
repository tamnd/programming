kotlin:
  status: native
  reason: a data class is a product, and a sealed class or sealed interface whose direct subclasses are data classes is a sum of products; no example file because kotlinc is not installed on the machine that recorded the examples.
powershell:
  status: absent
  reason: PowerShell has classes, hashtables and enums, but no type whose value is one of a closed set of cases with their own data; no example file because pwsh is not installed on the machine that recorded the examples.
  alternative: a class or a hashtable for a product, and an object with a kind property and a switch statement for a sum.
bash:
  status: n/a
  reason: Bash has no types, only strings and arrays of strings.
  alternative: separate variables for the parts of a product, and a string that holds the kind with a case statement for a sum.
sql:
  status: idiom
  reason: a row of a table is a product of its columns; a sum is a kind column with one nullable column for each field of each case, or one table for each case.
regex:
  status: n/a
  reason: a pattern has no types.
html:
  status: n/a
  reason: markup has no types.
css:
  status: n/a
  reason: style rules have no types.
