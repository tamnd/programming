kotlin:
  status: idiom
  reason: Kotlin has no union types; a sealed interface gives a closed set of cases, and a value of type Any can be tested with is in a when expression. No example file because kotlinc is not installed on the machine that recorded the examples.
powershell:
  status: idiom
  reason: a variable can hold a value of any type, and the -is operator tests the type; no example file because pwsh is not installed on the machine that recorded the examples.
bash:
  status: n/a
  reason: every value in Bash is a string.
