c:
  status: absent
  reason: ISO C has no nested functions and no function values that carry an environment.
  alternative: a function pointer and a void * context argument; the GCC nested functions and Clang blocks extensions are not standard.
bash:
  status: absent
  reason: functions are not values, and variables declared with local have dynamic scope.
  alternative: a global variable with a name prefix, or a separate process.
sql:
  status: n/a
  reason: a query has no functions as values.
regex:
  status: n/a
  reason: a pattern has no functions.
html:
  status: n/a
  reason: markup has no functions.
css:
  status: n/a
  reason: style rules have no functions as values.
