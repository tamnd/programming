kotlin:
  status: native
  reason: Kotlin functions take parameters of function types, and a caller passes a lambda or a function reference. No example file exists because kotlinc is not installed.
powershell:
  status: idiom
  reason: A PowerShell function can take a script block as a parameter and call it with the & operator. No example file exists because pwsh is not installed.
sql:
  status: n/a
  reason: Standard SQL has no function values, so a query cannot pass a function to another function.
regex:
  status: n/a
  reason: A regular expression has no functions.
html:
  status: n/a
  reason: HTML is a markup language. Event handler attributes hold JavaScript code, and the browser calls it.
css:
  status: n/a
  reason: CSS has no functions that a style sheet can pass.
