kotlin:
  status: native
  reason: Kotlin supports local functions, which are functions declared inside other functions. No example file exists because kotlinc is not installed.
powershell:
  status: idiom
  reason: A PowerShell function can define another function in its body, and the inner function is in the scope of the outer function. No example file exists because pwsh is not installed.
sql:
  status: n/a
  reason: Standard SQL queries do not declare functions.
regex:
  status: n/a
  reason: A regular expression has no functions.
html:
