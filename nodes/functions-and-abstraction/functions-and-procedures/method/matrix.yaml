bash:
  status: n/a
  reason: Bash has no types that hold functions, so it has no methods. A Bash function takes all its data as arguments or global variables.
kotlin:
  status: native
  reason: Kotlin has member functions in classes, and a companion object holds functions that belong to the class. No example file exists because kotlinc is not installed.
powershell:
  status: native
  reason: A PowerShell class can define methods, and the receiver is $this. No example file exists because pwsh is not installed.
sql:
  status: n/a
  reason: Standard SQL queries call functions, not methods. Some databases add methods to user-defined types, but most code uses plain functions.
regex:
  status: n/a
  reason: A regular expression has no functions and no methods.
html:
  status: n/a
  reason: HTML is a markup language and has no methods. Methods of the DOM objects belong to JavaScript.
css:
  status: n/a
  reason: CSS has no types with methods.
