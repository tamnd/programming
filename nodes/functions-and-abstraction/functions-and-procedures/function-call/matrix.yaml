kotlin:
  status: native
  reason: Kotlin calls a function with its arguments in parentheses, and it also has named arguments. No example file exists because kotlinc is not installed.
powershell:
  status: native
  reason: PowerShell calls a function like a command, with the arguments after the name and no parentheses. No example file exists because pwsh is not installed.
sql:
  status: native
  reason: A query calls a function with its arguments in parentheses, as in SELECT upper(name). No example file exists.
regex:
  status: n/a
  reason: A regular expression has no functions to call.
html:
  status: n/a
  reason: HTML is a markup language and has no function calls. Scripts in a page use JavaScript.
css:
  status: native
  reason: CSS calls its built-in functions with arguments in parentheses, such as calc(100% - 2em) and var(--gap). A style sheet cannot define its own functions in a standard module.
