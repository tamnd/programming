kotlin:
  status: native
  reason: A Kotlin function declares the type of each parameter and the return type after a colon. No example file exists because kotlinc is not installed.
powershell:
  status: native
  reason: A PowerShell function can declare typed parameters in a param block, and the OutputType attribute declares the result type. No example file exists because pwsh is not installed.
sql:
  status: native
  reason: CREATE FUNCTION declares the name, the typed parameters and the RETURNS type of a function. No example file exists.
regex:
  status: n/a
  reason: A regular expression has no functions, so it has no signatures.
html:
  status: n/a
  reason: HTML is a markup language and has no functions. Scripts in a page use JavaScript.
css:
  status: n/a
  reason: CSS cannot define functions in a standard module, so it has no function signatures.
