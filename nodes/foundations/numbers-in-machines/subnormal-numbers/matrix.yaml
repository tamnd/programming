typescript:
  status: native
  reason: TypeScript numbers are JavaScript numbers, and Number.MIN_VALUE is the smallest subnormal in the main engines. No example file exists.
kotlin:
  status: native
  reason: Kotlin Double is the JVM double, so it has subnormals. No example file exists because kotlinc is not installed.
bash:
  status: absent
  reason: Bash arithmetic expansion has integers only, so there are no floats and no subnormals. No example file exists.
powershell:
  status: native
  reason: PowerShell [double] is System.Double, with [double]::Epsilon as the smallest subnormal and [double]::IsSubnormal. No example file exists because pwsh is not installed.
sql:
  status: native
  reason: PostgreSQL double precision follows IEEE 754 on the supported platforms, and a number too close to zero to be distinct from zero gives an underflow error. No example file exists.
regex:
  status: n/a
  reason: A pattern matches text and does no arithmetic.
html:
  status: n/a
  reason: HTML has no arithmetic.
css:
  status: absent
  reason: CSS has no constant and no test for subnormal values. No example file exists.
