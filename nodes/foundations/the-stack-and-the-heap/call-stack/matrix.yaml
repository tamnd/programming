kotlin:
  status: native
  reason: Kotlin on the JVM uses the JVM stack, and the program can read it with StackWalker or the stackTrace of a Throwable. No example file exists because kotlinc is not installed.
powershell:
  status: native
  reason: The Get-PSCallStack cmdlet shows the call stack of a script. No example file exists because pwsh is not installed.
sql:
  status: n/a
  reason: A query has no call stack that the code can see.
regex:
  status: n/a
  reason: A regular expression has no calls.
html:
  status: n/a
  reason: HTML has no calls.
css:
  status: n/a
  reason: CSS has no calls.
