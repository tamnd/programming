# The releases of C# (spec 09.1). Keyed by C# version: each C# version ships with one major release of .NET and is the default language version for that target (the Defaults table of https://learn.microsoft.com/dotnet/csharp/language-reference/language-versioning). The dotnet field names that release; released, latest, lts, status and eol are those of the .NET release.
# Sources: https://dotnet.microsoft.com/platform/support/policy/dotnet-core (dates, release types, statuses, end of support; "even-numbered releases are LTS", STS gets two years); https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/releases-index.json and <channel>/releases.json (newest patches, csharp-version of each SDK); https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-version-history and csharp-15 (C# versions); https://endoflife.date/api/v1/products/dotnet/ (cross-check). The support for .NET 8 and .NET 9 ends on 2026-11-10, the date of the check. Checked 2026-11-10.
- version: "15"
  dotnet: "11"
  status: go-live
  released: null
  planned: true
  latest: {v: 11.0.0-rc.3, date: 2026-10-25, prerelease: true}
  eol: null
  eol_rule: two years after the release of .NET 11 (STS)
  notes: https://learn.microsoft.com/dotnet/csharp/whats-new/csharp-15
- version: "14"
  dotnet: "10"
  lts: true
  status: active
  released: 2025-11-11
