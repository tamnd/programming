# The implementations of Python (spec 04.4, 09.2). compat: true marks the columns of the compat tables. Checked 2026-11-09.
- id: cpython
  name: CPython
  compat: true
  reference: true
  python: "3.15"
  latest: {v: 3.15.2, date: 2026-10-25}
  licence: PSF-2.0
  source: https://www.python.org/downloads/
- id: pypy
  name: PyPy
  compat: true
  python: ["2.7", "3.11", "3.12"]
  note: The 3.12 interpreter is a beta.
  latest: {v: 8.0.1, date: 2026-10-14}
  licence: MIT
  source: https://doc.pypy.org/en/latest/release-v8.0.1.html
- id: graalpy
  name: GraalPy
  compat: true
  python: "3.13"
  latest: {v: 25.5.5, date: 2026-11-03}
  licence: UPL-1.0
