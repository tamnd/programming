# The releases of C (spec 09.1): the editions of the standard ISO/IEC 9899, from ANSI X3.159-1989 to C23, and C2y, which WG14 is writing now. A standard has no end of life, and endoflife.date has no entry for C. So each entry has eol: null, and status gives the state of the document as its publisher states it: current for C23 (the WG14 home page calls it "the current C programming language standard"), withdrawn for the older ISO editions (the ISO catalogue gives the date of withdrawal as withdrawn), superseded for the ANSI standard of 1989 (ISO/IEC 9899:1990 took its place; no ANSI status page was checked), in-development for C2y.
# std is the value of __STDC_VERSION__ for the edition (N3220, Annex M; C89 and C90 define no value). draft is the public draft that WG14 lists as similar to the edition.
# Sources: https://www.open-std.org/jtc1/sc22/wg14/www/projects (revisions, similar drafts, milestones); https://www.iso.org/standard/<id>.html (publication and withdrawal dates from the life cycle of each edition); https://nvlpubs.nist.gov/nistpubs/Legacy/FIPS/fipspub160.pdf (ANSI approval date); https://www.open-std.org/jtc1/sc22/wg14/www/docs/n3220.pdf (Annex M). Checked 2026-11-10.
