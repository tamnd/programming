# The implementations of C++ (spec 04.4, 09.2). compat: true marks the columns of the compat tables (registers/implementations.yaml: iso-cpp, gcc, clang, msvc, libstdcxx, libcxx, msvc-stl). Checked 2026-11-10.
# iso-cpp is the standard ISO/IEC 14882 (releases.yaml), not an implementation. C++ has no reference implementation. Each compiler and library states its own C++ level on its status page; the cpp field below gives that level, not a conformance claim.
- id: iso-cpp
  name: ISO/IEC 14882
  compat: true
  standard: true
  cpp: "23"
  note: The standard column of the compat tables. The newest published edition is ISO/IEC 14882:2024 (C++23); C++26 is the DIS, marked draft until ISO publishes it.
  latest: {v: "14882:2024", date: 2024-10}
  licence: ISO/IEC copyright
  source: https://www.iso.org/standard/83626.html
- id: gcc
  name: GCC (g++)
  compat: true
  cpp: "20"
  note: C++20 mode is the default from GCC 16, and the ABI of C++20 features was not stable until GCC 16. C++23 (-std=c++23, from GCC 11) and C++26 (-std=c++26, from GCC 14) are experimental. GCC 13.5 (2026-09-11) is later by date, as a release of an older series.
  latest: {v: "16.2", date: 2026-08-07}
  licence: GPL-3.0-or-later
  source: https://gcc.gnu.org/projects/cxx-status.html
- id: clang
  name: Clang
  compat: true
  cpp: "17"
  note: Clang 16 and later build C++ according to C++17 by default. The status page marks C++20, C++23 and C++2c (C++26) as Partial; C++17 is in Clang 5. The page describes the development version.
  latest: {v: 23.1.5, date: 2026-11-03}
  licence: Apache-2.0 WITH LLVM-exception
  source: https://clang.llvm.org/cxx_status.html
- id: msvc
  name: MSVC
  compat: true
  cpp: "14"
  note: /std:c++14 is the default; /std:c++20 enables C++20. C++23 features need /std:c++23preview (from Visual Studio 2022 17.13 Preview 4) or /std:c++latest. MSVC Build Tools 14.51 first shipped with Visual Studio 2026 18.6 (2026-05-12); 18.11.3 is the newest Visual Studio 2026 release.
  latest: {v: "Visual Studio 2026 18.11.3, MSVC Build Tools 14.51", date: 2026-10-29}
  licence: Microsoft Software License Terms (proprietary)
  source: https://learn.microsoft.com/en-us/cpp/overview/visual-cpp-language-conformance
- id: libstdcxx
  name: libstdc++
  compat: true
  library: true
  cpp: "20"
  note: The standard library of GCC, released with it. GCC 9.1 was the first release with non-experimental C++17 support. The C++20 and C++23 tables give the first release of each feature; std::print (P2093R14) is in 14.1.
  latest: {v: "16.2", date: 2026-08-07}
  licence: GPL-3.0-or-later WITH GCC-exception-3.1
  source: https://gcc.gnu.org/onlinedocs/libstdc++/manual/status.html
- id: libcxx
  name: libc++
  compat: true
  library: true
  cpp: "20"
  note: The standard library of LLVM, released with it. On the status pages, most C++20 and C++23 papers are Complete and some are Partial or open; P2093R14 Formatted output is Complete.
  latest: {v: 23.1.5, date: 2026-11-03}
  licence: Apache-2.0 WITH LLVM-exception
  source: https://libcxx.llvm.org/Status/Cxx23.html
- id: msvc-stl
  name: MSVC STL
  compat: true
  library: true
  cpp: "20"
  note: The standard library of MSVC. The changelog names 14.51 as the production version and says that the STL is C++23 feature complete in the MSVC Build Tools 14.52 Preview. The GitHub release msvc-build-tools-14.51 is dated 2026-06-23; the date below is the Visual Studio 2026 18.6 release that shipped 14.51.
  latest: {v: "14.51", date: 2026-05-12}
  licence: Apache-2.0 WITH LLVM-exception
  source: https://github.com/microsoft/STL/wiki/Changelog
