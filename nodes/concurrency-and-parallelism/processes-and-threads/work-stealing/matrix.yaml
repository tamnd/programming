typescript:
  status: absent
  reason: TypeScript runs on a JavaScript engine, with one thread for each event loop and no work-stealing scheduler. No example file exists.
  alternative: a model of the rules, as in the JavaScript example
kotlin:
  status: stdlib
  reason: on the JVM, Kotlin uses the Java ForkJoinPool, as in the Java example; no example file because kotlinc is not installed on the machine that recorded the examples.
c:
  status: library
  reason: the C standard library has no work-stealing scheduler; OpenMP tasks use child stealing. No separate example file.
  alternative: a model of the rules, as in the C++ example
bash:
  status: absent
  reason: Bash has no scheduler for tasks. No example file exists.
powershell:
  status: absent
  reason: PowerShell has no work-stealing scheduler; no example file because pwsh is not installed on the machine that recorded the examples.
sql:
  status: n/a
  reason: the database schedules its own work; a query does not create tasks.
regex:
  status: n/a
  reason: a pattern has no tasks.
html:
  status: n/a
  reason: markup has no tasks.
css:
  status: n/a
  reason: style rules have no tasks.
