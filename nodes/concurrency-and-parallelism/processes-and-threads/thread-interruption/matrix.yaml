typescript:
  status: stdlib
  reason: TypeScript runs on a JavaScript engine and uses the same Node.js worker API. No example file exists.
  alternative: worker.terminate() or a stop flag in a SharedArrayBuffer, as in the JavaScript example
kotlin:
  status: stdlib
  reason: on the JVM, Kotlin uses the Java Thread.interrupt, as in the Java example; no example file because kotlinc is not installed on the machine that recorded the examples.
c:
  status: stdlib
  reason: POSIX has pthread_cancel, which runs the cleanup handlers of the thread. No separate example file.
  alternative: a stop flag in an atomic variable, like the stop token in the C++ example
bash:
  status: n/a
  reason: a Bash script runs in one thread for each process.
powershell:
  status: stdlib
  reason: PowerShell runs on .NET and can use its CancellationToken; no example file because pwsh is not installed on the machine that recorded the examples.
sql:
  status: n/a
  reason: a query has no threads.
regex:
  status: n/a
  reason: a pattern has no threads.
html:
  status: n/a
  reason: markup has no threads.
css:
  status: n/a
  reason: style rules have no threads.
