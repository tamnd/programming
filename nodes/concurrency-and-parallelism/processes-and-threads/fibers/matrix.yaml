typescript:
  status: absent
  reason: TypeScript runs on a JavaScript engine, which has no fibers. No example file exists.
  alternative: generator functions with yield*, as in the JavaScript example
kotlin:
  status: absent
  reason: Kotlin has no fiber type in its standard library; no example file because kotlinc is not installed on the machine that recorded the examples.
  alternative: a virtual thread and a SynchronousQueue, as in the Java example
c:
  status: library
  reason: the C standard library has no fibers; glibc has getcontext, makecontext and swapcontext in ucontext.h, and Windows has the Win32 fiber API. No separate example file.
  alternative: the ucontext.h functions, as in the C++ example
bash:
  status: absent
  reason: Bash has no fibers. No example file exists.
powershell:
  status: absent
  reason: PowerShell has no fibers; no example file because pwsh is not installed on the machine that recorded the examples.
sql:
  status: n/a
  reason: a query does not run threads of execution.
regex:
  status: n/a
  reason: a pattern has no threads of execution.
html:
  status: n/a
  reason: markup has no threads of execution.
css:
  status: n/a
  reason: style rules have no threads of execution.
