typescript:
  status: absent
  reason: TypeScript runs on a JavaScript engine, which has no virtual threads. No example file exists.
  alternative: async functions on the event loop, as in the JavaScript example
kotlin:
  status: stdlib
  reason: on the JVM, Kotlin uses the Java virtual threads, as in the Java example; no example file because kotlinc is not installed on the machine that recorded the examples.
c:
  status: absent
  reason: C threads are OS threads; no separate example file.
  alternative: a fixed set of OS threads, as in the C++ example
bash:
  status: absent
  reason: Bash has no threads. No example file exists.
  alternative: background processes with & and wait
powershell:
  status: absent
  reason: thread jobs run on OS threads; no example file because pwsh is not installed on the machine that recorded the examples.
  alternative: Start-ThreadJob with -ThrottleLimit
sql:
  status: n/a
  reason: a query does not start threads.
regex:
  status: n/a
  reason: a pattern has no threads.
html:
