javascript:
  status: library
  reason: EventEmitter from node:events calls each listener of an event in one process, and a broker client such as amqplib gives fanout exchanges between processes.
  alternative: the Python example.
typescript:
  status: library
  reason: the same EventEmitter and broker clients as JavaScript, with a type for the events.
  alternative: the C# example, which has a typed channel.
rust:
  status: idiom
  reason: tokio::sync::broadcast gives each receiver a copy of each value, and with std::sync::mpsc a topic keeps one sender for each subscriber; tokio is a crate.
  alternative: the Go example, which also has typed channels.
c:
  status: library
  reason: a channel needs a broker library such as librabbitmq or librdkafka, or a queue protected by a mutex and a condition variable inside one process.
  alternative: the Go example.
cpp:
  status: library
  reason: the standard library has no concurrent queue; a std::deque with std::mutex and std::condition_variable gives one, and broker clients are libraries.
  alternative: the Java example.
kotlin:
  status: idiom
  reason: kotlinx.coroutines has SharedFlow, which gives each collector each value; no example is executed here because the test image has no kotlinc.
  alternative: the Go example.
sql:
  status: idiom
  reason: PostgreSQL NOTIFY sends a notification to each session that ran LISTEN on the channel name; a session that is not listening does not get it.
  alternative: the Python example.
bash:
  status: idiom
  reason: tee copies its input to each file or pipe that it is given, a fan-out with no broker.
  alternative: the Python example.
powershell:
  status: idiom
  reason: System.Collections.Concurrent.BlockingCollection or System.Threading.Channels from .NET gives the channel; no example is executed here because the test image has no pwsh.
  alternative: the C# example.
regex:
  status: n/a
  reason: a pattern has no messages and no subscribers.
html:
  status: n/a
  reason: markup has no messages and no subscribers.
css:
  status: n/a
  reason: style rules have no messages and no subscribers.
