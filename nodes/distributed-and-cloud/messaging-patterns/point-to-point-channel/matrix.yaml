javascript:
  status: library
  reason: a broker client such as amqplib for RabbitMQ gives a queue that many consumers read; inside one process, worker threads get jobs through a message port for each worker.
  alternative: the Python example.
typescript:
  status: library
  reason: the same broker clients as JavaScript, with a type for the jobs.
  alternative: the C# example, which has a typed channel.
rust:
  status: idiom
  reason: std::sync::mpsc has one receiver for each channel, so the workers share it behind a Mutex; broker clients such as lapin are crates.
  alternative: the Go example, which also has typed channels.
c:
  status: library
  reason: a channel needs a broker library such as librabbitmq or librdkafka, or a queue protected by a mutex and a condition variable inside one process.
  alternative: the Go example.
cpp:
  status: library
  reason: the standard library has no concurrent queue; a std::deque with std::mutex and std::condition_variable gives one, and broker clients are libraries.
  alternative: the Java example.
kotlin:
  status: idiom
  reason: kotlinx.coroutines has Channel, and many coroutines that receive from one channel share its elements; no example is executed here because the test image has no kotlinc.
  alternative: the Go example.
sql:
  status: idiom
  reason: a table can be a queue: each worker takes one row with SELECT ... FOR UPDATE SKIP LOCKED in PostgreSQL, so no two workers take the same row.
  alternative: the Python example.
bash:
  status: idiom
  reason: xargs -P shares a list of jobs between processes, each job to one process; there is no broker and no acknowledgement.
  alternative: the Python example.
powershell:
  status: idiom
  reason: System.Collections.Concurrent.BlockingCollection or System.Threading.Channels from .NET gives the channel; no example is executed here because the test image has no pwsh.
  alternative: the C# example.
regex:
  status: n/a
  reason: a pattern has no messages and no receivers.
html:
  status: n/a
  reason: markup has no messages and no receivers.
css:
  status: n/a
  reason: style rules have no messages and no receivers.
