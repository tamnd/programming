# SPDX-License-Identifier: CC0-1.0
# The implementation columns of the compat entries of each language (spec 09.2). A column with main: true counts for the computed status (09.5). A column with standard: true is the language standard, not a program.
# releases lists the releases of an implementation, oldest first. Rule K02 checks each version of a compat entry against it, and prog compat probe takes the release before version_added from it.
# image and run tell prog compat probe how to run a probe on a release: {v} is the version and {file} is the probe file.
# Sources: CPython from python/release-status release-cycle.json, Rust from RELEASES.md of rust-lang/rust, PyPy from the PyPy index of release notes, GraalPy and MicroPython from their GitHub releases. Read on 2026-11-10.

python:
  - id: cpython
    name: CPython
    main: true
    image: "python:{v}-slim"
    run: [python, "{file}"]
    releases: ["3.0", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
