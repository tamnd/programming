- id: libraries-npm
  scope: libraries
  rule: "A package of npm gets a card when at least 427 other packages in npm depend on it. The base rule of spec 18.5 is 100, and the bar is higher so that the registry gives at most 5,000 cards. Each other package of npm is out of scope."
