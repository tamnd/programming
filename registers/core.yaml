# The core list of spec 05.4: the items that every programmer needs. It is the measure of milestones M2 and M3 (spec 21).
# Status: proposed. A person approves the list at the end of milestone M1 and then changes the status to approved.
# Each item has a part, a group, a name, a target, a status and a reason. The target is the node slug or the card id. When the item has no node or card yet, the status is planned and the target is the proposed slug.
status: proposed
parts:
