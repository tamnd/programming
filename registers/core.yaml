# SPDX-License-Identifier: CC0-1.0
# The core list of spec 05.4: the items that every programmer needs. It is the measure of milestones M2 and M3 (spec 21).
# Status: proposed. A person approves the list at the end of milestone M1 and then changes the status to approved.
# Each item has a part, a group, a name, a target, a status and a reason, and a task can have a related node. The target is the node slug or the card id. When the item has no node or card yet, the status is planned and the target is the proposed slug.
status: proposed
parts:
  - id: concepts
    name: "Core concepts"
    estimate: 400
    items: 186
    source: "a hand list of candidates, checked against CS2023 (the SDF and FPL knowledge areas and SE-Construction), 7 language references (the Python Language Reference, the Go spec, the Rust Reference, the JLS, the C++ working draft, the C# standard and ECMAScript 2027) and 4 canon books (the SICP index and the contents of HtDP, Crafting Interpreters and The Rust Programming Language)"
    note: "A candidate is core when 2 of the 3 sources hold it: CS2023, at least 3 of the 7 references, or at least 1 of the 4 books. SWEBOK v4 is not checked yet, because its PDF needs an IEEE account. The candidates that have one source or none are in the candidates list at the end of this file, for the review."
  - id: features
    name: "Core features"
    estimate: 1800
    items: 1476
    source: "the section titles of the official tutorial of each tier-1 language: The Python Tutorial, cppreference (the C and C++ language pages), Learn Java on dev.java, the C# guide and language reference, the JavaScript Guide and the regular expression pages of MDN, the TypeScript Handbook, A Tour of Go, The Rust Programming Language, the Kotlin tour and language guide, the PostgreSQL tutorial and The SQL Language, the Bash Reference Manual, Learning PowerShell and the PowerShell about topics, the MDN modules Structuring content with HTML, CSS styling basics and CSS layout, and the Python Regular Expression HOWTO"
    note: "Each item is a section of the tutorial, reviewed by hand: the parts of the text that are not features (introductions, exercises, projects and summaries) are not in the list, and some names are shorter than the section title. The group is the language and the area is the sub-area of the language template (topics/languages.yaml) or of the domain template (topics/domains.yaml). The target is the path <language>/<sub-area>/<slug> of the feature node in the language tree. The total is lower than the estimate, because some tutorials are short (Kotlin, C, SQL, HTML and regex): the reference manuals can add features in a later step."
  - id: tasks
    name: "Core tasks"
    estimate: 300
    items: 374
    source: "by hand, checked against the task names of Rosetta Code and the titles of Go by Example and Rust by Example (spec 10.1)"
  - id: patterns
    name: "Core patterns"
    estimate: 150
    items: 170
    source: "the canon (spec 13.3) and the Azure cloud design patterns"
  - id: refactorings
    name: "Core refactorings"
    estimate: 66
    items: 66
    source: "the catalogue of refactoring.com, names only"
  - id: smells
    name: "Core code smells"
    estimate: 24
    items: 24
    source: "Refactoring, 2nd edition, chapter 3, names only"
  - id: weaknesses
    name: "Core weaknesses"
    estimate: 35
    items: 35
    source: "the CWE Top 25 (2025) and the OWASP Top 10:2025"
  - id: tools
    name: "Core tools"
    estimate: 120
    items: 103
    source: "the toolchain rows of the tier-1 languages, then by hand"
  - id: formats
    name: "Core formats and standards"
    estimate: 40
    items: 40
    source: "by hand, with reasons"
  - id: practices
    name: "Core practices"
    estimate: 80
    items: 82
    source: "the canon (spec 13.3)"
