  lint: {tool: clippy, args: [-D, warnings]}
  toolchain: Rust stable, edition 2024
  run: cargo test
  comment: "//"
  highlight: rust
  int: i64
  list: "Vec<T> / &[T]"
  since: 2026-11
- id: kotlin
