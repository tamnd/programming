# SPDX-License-Identifier: CC0-1.0
#
# The jobs that run code from the content (audit, tests, site) have no secrets. Only the deploy job has the Cloudflare token, and it runs no code from the content: it uploads the site that the site job made.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROG_VERSION: v0.0.24
  GO_VERSION: "1.27.x"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install prog
        run: go install "github.com/tamnd/programming-agent/cmd/prog@${PROG_VERSION}"
      - name: Check the format
        run: prog fmt -check
      - name: Show the tags that the merge gives
        if: github.event_name == 'pull_request'
        run: prog mint -dry-run
      - name: Audit the changed nodes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: prog check -checkers -changed "$BASE"
      - name: Audit all nodes
        if: github.event_name != 'pull_request'
        run: prog check -checkers -main
      - name: Count the universe items of each scope
        run: prog universe
      # Spec 18.2: the exit of M1 needs each card scope at C1. The gate fails when a card has a blocking finding of the R rules.
      - name: Check that each card scope is at C1
        run: prog coverage -gate
      - name: Check the scenes
        run: prog viz check

  test:
    name: Test (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lang: [python, cpp, java, c, csharp, javascript, typescript, go, rust, kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install prog
        run: go install "github.com/tamnd/programming-agent/cmd/prog@${PROG_VERSION}"
      # The cache keeps the results of the examples and the tasks that passed. A result is used again only while prog, the toolchain, the files and the cases stay the same.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-cache
          key: test-${{ matrix.lang }}-${{ github.run_id }}
          restore-keys: test-${{ matrix.lang }}-
      - name: Run the tests
        env:
          LANG_ID: ${{ matrix.lang }}
        # Each build and test runs in a container of the image that manifests/images.yaml pins, with no network (spec 07.6).
        run: prog test -sandbox docker -lang "$LANG_ID" -cache build/test-cache -out build/results
      - name: Run the code blocks of the pages
        env:
          LANG_ID: ${{ matrix.lang }}
        # Each block runs in the same image as the tests, and its output must match the output block of the page (spec 07.2).
        run: prog run -sandbox docker -lang "$LANG_ID" -out "build/results/runs/runs-$LANG_ID.json"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: build/test-cache
          key: test-${{ matrix.lang }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.lang }}
          path: build/results
          retention-days: 7

  site:
    needs: [audit, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install prog
        run: go install "github.com/tamnd/programming-agent/cmd/prog@${PROG_VERSION}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: build/results
          merge-multiple: true
      - name: Render the site and check the links
        run: prog site check -out build/site -minify
      - name: Check the limits of Cloudflare Pages
        run: |
          files=$(find build/site -type f | wc -l)
          big=$(find build/site -type f -size +24M | wc -l)
          echo "The site has $files files."
          if [ "$files" -gt 19500 ]; then echo "::error::The site has more than 19500 files."; exit 1; fi
          if [ "$big" -gt 0 ]; then echo "::error::A file of the site is larger than 24 MB."; exit 1; fi
      # The build server deploys main (scripts/deploy-cloudflare.sh). It reads the test results of the last run on main from the release ci-results.
      - name: Publish the test results for the build server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf results.tar.gz -C build/results .
          gh release upload ci-results results.tar.gz --clobber -R "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/site
          retention-days: 7

  # The build server deploys each push to main in minutes, so this job deploys only the preview of a pull request, and production when a person runs the workflow by hand.
  deploy:
    needs: site
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url || 'https://programming.tamnd.com' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install prog
        run: go install "github.com/tamnd/programming-agent/cmd/prog@${PROG_VERSION}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # prog site deploy checks the limits of Cloudflare Pages again and uploads the tree with a pinned wrangler. It does not print the token.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BRANCH" = main ]; then
            prog site deploy -no-build -out site -commit "$SHA" | tee deploy.log
          else
            prog site deploy -no-build -out site -commit "$SHA" -preview -branch "$BRANCH" | tee deploy.log
          fi
          tail -1 deploy.log >> "$GITHUB_STEP_SUMMARY"
